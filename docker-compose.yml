version: '3.3'
services:
  databasefinancas:
    image: mysql:5.7
    container_name: "databasefinancas"
    environment:
      MYSQL_DATABASE: 'DB_GerenciamentoDeFinancas'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'adm-user'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'root'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - ./docker/databasefinancas/volume/data:/var/lib/mysql

  api-financas:
    container_name: "api-financas"
    build: .
    ports:
      # <Port exposed> : <API Port running inside container>
      - '8080:8080'
    expose:
      # Opens port 8080 on the container
      - '8080'
      # Where our data will be persisted
    environment:
      - DB_HOST=databasefinancas
      - DB_PORT=3306
      - DB_USER=adm-user
      - DB_PASSWORD=root
    volumes:
      - ./docker/apifinancas/volume/data:/home/app/
    depends_on:
      - databasefinancas